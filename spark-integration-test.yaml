apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-integration-test
  namespace: data-platform
spec:
  type: Python
  mode: cluster
  sparkVersion: "3.5.5"
  image: spark-iceberg:3.5.5
  imagePullPolicy: Never
  mainApplicationFile: local:///opt/spark/work-dir/s3_read_test.py

  restartPolicy:
    type: Never

  sparkConf:
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.hive_prod": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.hive_prod.type": "hive"
    "spark.sql.catalog.hive_prod.uri": "thrift://hive-metastore.data-platform.svc.cluster.local:9084"
    "spark.sql.catalog.hive_prod.warehouse": "s3a://warehouse/"
    "spark.hadoop.fs.s3a.endpoint": "http://seaweedfs.data-platform.svc.cluster.local:8333"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.access.key": "dev_key"
    "spark.hadoop.fs.s3a.secret.key": "dev_secret"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"

  driver:
    cores: 1
    memory: "512m"
    serviceAccount: spark-operator-spark

  executor:
    instances: 1
    cores: 1
    memory: "512m"
