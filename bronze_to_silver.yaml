apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: bronze-to-silver
  namespace: data-platform
spec:
  type: Python
  mode: cluster
  pythonVersion: "3"
  image: spark-iceberg:3.5.5
  imagePullPolicy: Never
  mainApplicationFile: local:///opt/spark/work-dir/batch_bronze_to_silver.py
  sparkVersion: "3.5.5"
  restartPolicy:
    type: Never
  volumes:
    - name: pipeline-script
      hostPath:
        path: /mnt/jobs/
        type: Directory
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark-operator-spark
    volumeMounts:
      - name: pipeline-script
        mountPath: /opt/spark/work-dir
        readOnly: true
  executor:
    instances: 1
    cores: 1
    memory: "1g"
    volumeMounts:
      - name: pipeline-script
        mountPath: /opt/spark/work-dir
        readOnly: true

  sparkConf:
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.silver": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.silver.type": "hive"
    "spark.sql.catalog.silver.uri": "thrift://hive-metastore.data-platform.svc.cluster.local:9084"
    "spark.sql.catalog.silver.warehouse": "s3a://silver/"

    "spark.hadoop.fs.s3a.endpoint": "http://seaweedfs.data-platform.svc.cluster.local:8333"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.access.key": "dev_key"
    "spark.hadoop.fs.s3a.secret.key": "dev_secret"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"

    "spark.sql.shuffle.partitions": "2"
