apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: data-platform
data:
  config.yaml: |
    jobmanager.rpc.address: flink-jobmanager.data-platform.svc.cluster.local
    jobmanager.rpc.port: 6123
    blob.server.port: 6124
    query.server.port: 6125

    rest.address: flink-jobmanager.data-platform.svc.cluster.local
    rest.bind-address: 0.0.0.0
    rest.port: 8081

    env.java.opts.all: --add-opens=java.base/java.util=ALL-UNNAMED

    jobmanager.memory.process.size: 1600m
    taskmanager.memory.process.size: 1600m
    taskmanager.numberOfTaskSlots: 2

    security.delegation.token.provider.hadoopfs.enabled: false
    security.delegation.token.provider.hiveserver2.enabled: false

    fs.s3a.endpoint: http://seaweedfs.data-platform.svc.cluster.local:8333
    fs.s3a.access.key: dev_key
    fs.s3a.secret.key: dev_secret
    fs.s3a.path.style.access: true
    fs.s3a.connection.ssl.enabled: false
    fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem

    # Persistent checkpoint state in SeaweedFS
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: s3a://warehouse/flink-checkpoints/

    # Python dependencies for PyFlink
    python.executable: /opt/pyflink-venv/bin/python
    python.client.executable: /opt/pyflink-venv/bin/python
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyflink-test-file
  namespace: data-platform
data:
  ui_test.py: |
    from pyflink.datastream import StreamExecutionEnvironment

    env = StreamExecutionEnvironment.get_execution_environment()
    env.set_parallelism(1)

    numbers = env.from_collection([1, 2, 3, 4, 5])

    numbers.map(lambda x: f"PyFlink works: {x}").print()

    env.execute("pyflink-ui-test")
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: data-platform
spec:
  type: LoadBalancer
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob
      port: 6124
      targetPort: 6124
    - name: ui
      port: 8081
      targetPort: 8081
  selector:
    app: flink
    component: jobmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      containers:
        - name: jobmanager
          image: flink-pyflink:2.2.1
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0

          command: ["/docker-entrypoint.sh"]
          args: ["jobmanager"]
          ports:
            - name: rpc
              containerPort: 6123
            - name: blob
              containerPort: 6124
            - name: ui
              containerPort: 8081
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf/config.yaml
              subPath: config.yaml
            - name: pyflink-test-file-volume
              mountPath: /opt/flink/examples/pyflink/ui_test.py
              subPath: ui_test.py
          resources:
            requests:
              memory: "1800Mi"
              cpu: "500m"
            limits:
              memory: "2048Mi"
              cpu: "1"
      volumes:
        - name: flink-config-volume
          configMap:
            name: flink-config
        - name: pyflink-test-file-volume
          configMap:
            name: pyflink-test-file
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: flink-pyflink:2.2.1
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          command: ["/docker-entrypoint.sh"]
          args: ["taskmanager"]
          ports:
            - name: data
              containerPort: 6122
            - name: query
              containerPort: 6125
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "1800Mi"
              cpu: "500m"
            limits:
              memory: "2048Mi"
              cpu: "1"
      volumes:
        - name: flink-config-volume
          configMap:
            name: flink-config
