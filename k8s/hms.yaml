apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: data-platform
spec:
  type: LoadBalancer
  selector:
    app: hive-metastore
  ports:
    - name: thrift
      port: 9084
      targetPort: 9083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: data-platform
  labels:
    app: hive-metastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      initContainers:
        - name: download-ext-jars
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              BASE=https://repo1.maven.org/maven2

              curl -fL "$BASE/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar" \
                -o /shared-lib/postgresql-42.7.3.jar

              test -s /shared-lib/postgresql-42.7.3.jar
              echo "All external JARs downloaded."
          volumeMounts:
            - name: ext-jars
              mountPath: /shared-lib

        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z -w 2 postgres.data-platform.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;",
            ]

      containers:
        - name: hive-metastore
          image: apache/hive:3.1.3
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: METASTORE_PORT
              value: "9083"
            - name: HADOOP_CLASSPATH
              value: "/opt/hadoop/share/hadoop/tools/lib/*"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              echo "Checking Hive Metastore schema in PostgreSQL..."

              if schematool -dbType postgres -info >/tmp/schema-info.log 2>&1; then
                echo "Hive schema already exists. Skipping initialization."
                cat /tmp/schema-info.log
              else
                echo "Hive schema not found. Initializing..."
                cat /tmp/schema-info.log
                schematool -dbType postgres -initSchema --verbose
              fi

              echo "Starting Hive Metastore Service..."
              exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
          ports:
            - containerPort: 9083
              name: thrift
          volumeMounts:
            - name: ext-jars
              mountPath: /opt/hive/lib/postgresql-42.7.3.jar
              subPath: postgresql-42.7.3.jar
            - name: config-volume
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: metastore-site.xml
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: ext-jars
          emptyDir: {}
        - name: config-volume
          configMap:
            name: hive-metastore-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: data-platform
data:
  metastore-site.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="no"?>
    <configuration>
      <!-- Existing Database Properties -->
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:postgresql://postgres.data-platform.svc.cluster.local:5432/hive_metastore</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionDriverName</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionUserName</name>
        <value>postgres</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionPassword</name>
        <value>postgres</value>
      </property>
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://warehouse/</value>
      </property>
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://0.0.0.0:9083</value>
      </property>
      <property>
        <name>hive.metastore.schema.verification</name>
        <value>false</value>
      </property>

      <!-- ADD THE NEW CONFIGURATIONS HERE -->
      <!-- 1. Disable YARN-dependent housekeeping cleaner tasks -->
      <property>
        <name>hive.metastore.metastore.event.cleaner.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>metastore.compactor.initiator.on</name>
        <value>false</value>
      </property>
      <property>
        <name>metastore.compactor.worker.threads</name>
        <value>0</value>
      </property>

      <!-- 2. Auto-create missing database schema tables -->
      <property>
        <name>datanucleus.schema.autoCreateAll</name>
        <value>true</value>
      </property>
      <property>
        <name>datanucleus.schema.autoCreateTables</name>
        <value>true</value>
      </property>
      <!-- 3. S3 Configuration -->
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://seaweedfs.data-platform.svc.cluster.local:8333</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>dev_key</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>dev_secret</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.s3a.aws.credentials.provider</name>
        <value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value>
      </property>
    </configuration>
