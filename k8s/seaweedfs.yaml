apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data-platform
spec:
  type: LoadBalancer
  selector:
    app: seaweedfs
  ports:
    - port: 8333
      targetPort: 8333
      name: s3
    - port: 9333
      targetPort: 9333
      name: master
    - port: 8088
      targetPort: 8080
      name: volume
    - port: 8888
      targetPort: 8888
      name: filer-ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: data-platform
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "dev",
          "credentials": [
            {
              "accessKey": "dev_key",
              "secretKey": "dev_secret"
            }
          ],
          "actions": ["Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: data-platform
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.port=8333"
            - "-s3.config=/etc/seaweedfs/s3.json"
            - "-filer"
            - "-filer.port=8888"
            - "-ip.bind=0.0.0.0"
          volumeMounts:
            - name: s3-config
              mountPath: /etc/seaweedfs/s3.json
              subPath: s3.json
            - name: seaweedfs-data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1"
      volumes:
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
        - name: seaweedfs-data
          persistentVolumeClaim:
            claimName: seaweedfs-data
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
